name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build ARM64 release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload ARM64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: moataz-edge-v0.2-arm64-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
